name: Docker
# Builds docker/Dockerfile and smoke-tests the image, so a broken Dockerfile shows up on the PR
# instead of on the VPS's first deploy. Runs the container the way ops/docker-compose.yml does (uid
# 1001, no capabilities, no-new-privileges, 768 MB / 1 CPU, solar-cache mounted at
# /app/fixtures/solar) but with SOLAR_SOURCE=fixtures: no keys, no Google.
on:
  pull_request:
    paths:
      - docker/**
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - next.config.ts
      - ops/docker-compose.yml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: solmap:ci
  NAME: solmap-ci

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Same build as deploy.yml's (`-f docker/Dockerfile .`), plus the GitHub Actions layer cache.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            NEXT_PUBLIC_MAPS_API_KEY=ci-dummy-maps-key
            NEXT_PUBLIC_MAP_ID=ci-dummy-map-id
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Schema check of the VPS compose file (mem_limit, cap_drop, ...). Its env_file has to exist.
      - name: ops/docker-compose.yml is valid
        run: |
          touch ops/.env
          docker compose -f ops/docker-compose.yml config -q

      - name: No Google responses baked into the image
        run: |
          docker run --rm --entrypoint sh "$IMAGE" -c \
            'test -z "$(ls -A /app/fixtures/solar 2>/dev/null)"' \
            || { echo "::error::/app/fixtures/solar in the image is not empty (Google content must never ship)"; exit 1; }

      - name: Start container
        run: |
          # Stand-in for ~/solmap-ops/solar-cache on the VPS: a host dir owned by uid 1001.
          cache_dir="$RUNNER_TEMP/solar-cache"
          mkdir -p "$cache_dir"
          sudo chown 1001:1001 "$cache_dir"
          # The same hardening as ops/docker-compose.yml, so a change that needs a capability or more
          # memory fails here first. --health-interval only shortens the Dockerfile's HEALTHCHECK
          # interval so CI doesn't wait 30 s.
          docker run -d --name "$NAME" -p 3000:3000 \
            -e SOLAR_SOURCE=fixtures \
            -v "$cache_dir:/app/fixtures/solar" \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 768m --cpus 1 \
            --health-interval 2s \
            "$IMAGE"

      - name: Wait for the HEALTHCHECK to report healthy
        run: |
          for _ in $(seq 1 45); do
            state=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' "$NAME")
            echo "$state"
            case "$state" in
              "running healthy") exit 0 ;;
              running*) sleep 2 ;;
              *) echo "::error::container is not running ($state)"; exit 1 ;;
            esac
          done
          echo "::error::container did not become healthy within 90 s"
          exit 1

      - name: GET /api/health returns 200 {"ok":true}
        run: |
          code=$(curl -sS -o health.json -w '%{http_code}' http://127.0.0.1:3000/api/health)
          echo "HTTP $code: $(cat health.json)"
          test "$code" = 200
          jq -e '. == {"ok": true}' health.json
          # The exact command the compose healthcheck runs (busybox wget inside the container).
          docker exec "$NAME" wget -qO- http://127.0.0.1:3000/api/health

      - name: Runs as uid/gid 1001
        run: |
          # PID 1 is `node server.js`; check the real process, not just the image's USER.
          docker exec "$NAME" grep -E '^(Uid|Gid):' /proc/1/status
          docker exec "$NAME" sh -c 'awk "/^Uid:/{print \$2}" /proc/1/status' | grep -qx 1001
          docker exec "$NAME" sh -c 'awk "/^Gid:/{print \$2}" /proc/1/status' | grep -qx 1001

      - name: Next's runtime cache dirs are writable, the code is not
        run: |
          docker exec "$NAME" sh -euc '
            # What Next writes at runtime: .next/cache (next/image, fetch cache) and
            # .next/server/route-cache (response cache; the first request to / writes there).
            mkdir -p /app/.next/cache/ci && rmdir /app/.next/cache/ci
            mkdir -p /app/.next/server/route-cache/ci && rmdir /app/.next/server/route-cache/ci
            for p in /app/server.js /app/package.json /app/node_modules /app/.next \
                     /app/.next/server /app/.next/server/app /app/.next/static /app/public /app/fixtures; do
              if test -w "$p"; then echo "::error::$p is writable by the app user"; exit 1; fi
            done
            # Nothing else under /app may be owned by the app user or be world-writable (symlinks,
            # e.g. pnpm's in node_modules, always show 777 and are skipped).
            bad=$(find /app \( -path /app/.next/cache -o -path /app/.next/server/route-cache \
                               -o -path /app/fixtures/solar \) -prune \
                         -o ! -type l \( -user 1001 -o -perm -002 \) -print | head -n 20)
            if [ -n "$bad" ]; then echo "::error::writable by the app outside the cache dirs:"; echo "$bad"; exit 1; fi
          '

      - name: Synthetic fixtures ship in the image
        run: docker exec "$NAME" test -s /app/fixtures/synthetic/south-gable.json

      - name: Mounted solar-cache is writable (atomic temp + rename, like the disk cache)
        run: |
          docker exec "$NAME" sh -euc '
            dir=/app/fixtures/solar/building
            mkdir -p "$dir"
            echo "{}" > "$dir/.ci.tmp"
            mv "$dir/.ci.tmp" "$dir/ci.json"
            test -s "$dir/ci.json"
            rm -r "$dir"
          '

      - name: Serves the page, .next/static and public/
        run: |
          curl -fsS -o index.html http://127.0.0.1:3000/
          asset=$(grep -oE '/_next/static/[^"]+\.(js|css)' index.html | head -n1)
          test -n "$asset" || { echo "::error::no /_next/static asset referenced by /"; exit 1; }
          curl -fsS -o /dev/null "http://127.0.0.1:3000$asset" && echo "OK $asset"
          public_file=$(cd public 2>/dev/null && find . -type f | head -n1 | sed 's|^\./||')
          if [ -n "$public_file" ]; then
            curl -fsS -o /dev/null "http://127.0.0.1:3000/$public_file" && echo "OK /$public_file"
          fi

      # A root-owned path Next tries to write shows up as EACCES in the log, not as a failed request.
      - name: No permission errors in the container log
        run: |
          if docker logs "$NAME" 2>&1 | grep -E 'EACCES|EROFS|EPERM'; then
            echo "::error::the app hit a permission error writing to disk (see above)"
            exit 1
          fi

      - name: Container logs
        if: failure()
        run: |
          docker inspect -f '{{json .State}}' "$NAME" || true
          docker logs "$NAME" || true

      - name: Clean up
        if: always()
        run: docker rm -f "$NAME" || true
