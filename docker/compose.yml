# Lives at /srv/solmap/compose.yml on the VPS (copied from docker/compose.yml).
# Images are built by scripts/deploy.sh and tagged solmap:prod / solmap:staging.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
      STAGING_DOMAIN: ${STAGING_DOMAIN}
      STAGING_USER: ${STAGING_USER}
      STAGING_PASS_HASH: ${STAGING_PASS_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # No depends_on: Caddy resolves upstreams per request, and depends_on would make the very
    # first deploy try to pull a solmap:prod image that doesn't exist yet.

  prod:
    image: solmap:prod
    pull_policy: never
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      # Recorded Google responses for the USE_FIXTURES fallback. Lives on the VPS only, never in git
      # or the image; delete within 30 days of recording (Google terms). Synthetic fixtures are in the image.
      - ./fixtures-recorded:/app/fixtures/solar:ro

  staging:
    image: solmap:staging
    pull_policy: never
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      - ./fixtures-recorded:/app/fixtures/solar:ro

  # P2 only (share links). Uncomment if/when needed.
  # db:
  #   image: postgres:17
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: solmap
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #     POSTGRES_DB: solmap
  #   volumes: [pg_data:/var/lib/postgresql/data]

volumes:
  caddy_data:
  caddy_config:
